<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fednowshares Dashboard</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --navy: #103570;
    --blue: #528fe0;
    --purple: #565cf0;
    --teal: #299e91;
    --text: #566065;
    --light: #c4d2ec;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: var(--text);
    overflow-x: hidden;
}

/* TOP NAVIGATION */

.topbar {
    height: 272px;
    width: 100%;
    background: #ffffff;
    border-bottom: 1px solid #ededed;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 8.5% 39px;
}

button {
    font-family: inherit;
    cursor: pointer;
}

.back-button {
    border: none;
    background: transparent;
    color: var(--blue);
    font-size: 39px;
    font-weight: 300;
    line-height: 1;
}

.navigation {
    display: flex;
    align-items: center;
    gap: 43px;
}

.navigation button {
    border: none;
}

.home-button {
    width: 85px;
    height: 68px;
    background: var(--blue);
    color: #ffffff;
    border-radius: 9px;
    font-size: 37px;
}

.arrow-button,
.profile-button {
    background: transparent;
    color: #26343a;
    font-size: 31px;
}

.arrow-button {
    margin-left: 15px;
}

.profile-button {
    margin-left: 0;
}

/* PAGE LAYOUT */

.container {
    width: calc(100% - 84px);
    max-width: 1000px;
    margin: 43px auto 0;
}

/* BALANCE CARD */

.balance-card {
    background: var(--navy);
    color: white;
    border-radius: 9px;
    padding: 21px 32px 27px;
}

.balance-heading {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 35px;
}

.balance-heading h1 {
    font-size: 39px;
    font-weight: 750;
    line-height: 1.2;
    margin-top: 15px;
    letter-spacing: -0.5px;
}

.wallet-label {
    background: #ffffff;
    color: #101c22;
    font-size: 20px;
    font-weight: 800;
    text-align: center;
    padding: 14px 21px;
    border-radius: 9px;
    min-width: 120px;
}

.wallet-row {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 32px;
}

.wallet-row:last-child {
    margin-bottom: 12px;
}

.wallet-icon {
    width: 39px;
    flex-shrink: 0;
    text-align: center;
    font-size: 30px;
    color: #d5e0f4;
}

.wallet-name {
    flex: 1;
    color: var(--light);
    font-size: 33px;
    font-weight: 700;
}

.wallet-amount {
    color: #ffffff;
    font-size: 33px;
    font-weight: 750;
    white-space: nowrap;
}

/* ACTION BUTTONS */

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 31px;
    margin-top: 21px;
    margin-bottom: 42px;
}

.action-button {
    height: 94px;
    border: none;
    border-radius: 9px;
    color: #ffffff;
    font-size: 32px;
    font-weight: 400;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 13px;
    transition: opacity 0.2s;
}

.action-button:active {
    opacity: 0.8;
}

.deposit-button {
    background: var(--purple);
}

.invest-button {
    background: var(--teal);
}

.action-icon {
    font-size: 32px;
    font-weight: 300;
}

/* MENU */

.menu {
    border-top: 1px solid #eeeeee;
    margin-left: -42px;
    margin-right: -42px;
    padding: 31px 42px 80px;
}

.menu-item {
    display: flex;
    align-items: center;
    width: 100%;
    min-height: 108px;
    padding: 0 60px;
    gap: 23px;
    border: none;
    background: #ffffff;
    color: var(--text);
    text-align: left;
    font-size: 27px;
    font-weight: 750;
}

.menu-item:active {
    background: #f8f9fa;
}

.menu-icon {
    width: 34px;
    flex-shrink: 0;
    font-size: 30px;
    font-weight: 400;
    text-align: center;
    line-height: 1;
}

.menu-arrow {
    margin-left: auto;
    color: var(--blue);
    font-size: 25px;
}

.submenu.hidden {
    display: none;
}

.submenu .menu-item {
    min-height: 78px;
    padding-left: 100px;
    font-size: 21px;
}

/* FLOATING CHAT BUTTON */

.chat-button {
    position: fixed;
    right: 27px;
    bottom: 255px;
    width: 119px;
    height: 119px;
    background: #1760ed;
    border: none;
    border-radius: 50%;
    box-shadow: 0 5px 22px rgba(0, 0, 0, 0.12);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 15;
}

.chat-bubble {
    width: 54px;
    height: 38px;
    border-radius: 50%;
    background: #ffffff;
    position: relative;
}

.chat-bubble::after {
    content: "";
    position: absolute;
    left: 9px;
    bottom: -6px;
    width: 15px;
    height: 15px;
    background: #ffffff;
    transform: rotate(30deg);
    border-radius: 2px;
}

.online-dot {
    position: absolute;
    width: 32px;
    height: 32px;
    background: #45d889;
    border: 4px solid white;
    border-radius: 50%;
    left: 2px;
    bottom: 3px;
}

/* NOTIFICATION */

.notification {
    display: none;
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: max-content;
    max-width: 90%;
    padding: 14px 20px;
    background: var(--navy);
    color: white;
    border-radius: 9px;
    font-size: 15px;
    text-align: center;
    z-index: 30;
}

.notification.show {
    display: block;
}

/* MOBILE DESIGN */

@media (max-width: 600px) {

    .topbar {
        height: 272px;
        padding: 0 8.5% 39px;
    }

    .navigation {
        gap: 27px;
    }

    .home-button {
        width: 85px;
        height: 68px;
    }

    .arrow-button {
        margin-left: 5px;
    }

    .container {
        width: calc(100% - 84px);
        margin-top: 43px;
    }

    .balance-card {
        padding: 21px 32px 27px;
    }

    .balance-heading {
        margin-bottom: 35px;
    }

    .balance-heading h1 {
        font-size: clamp(25px, 4.7vw, 39px);
    }

    .wallet-label {
        min-width: 120px;
        font-size: 20px;
    }

    .wallet-row {
        gap: 15px;
        margin-bottom: 32px;
    }

    .wallet-name,
    .wallet-amount {
        font-size: clamp(19px, 4vw, 33px);
    }

    .actions {
        gap: 31px;
    }

    .action-button {
        height: 94px;
        font-size: clamp(19px, 3.9vw, 32px);
        gap: 10px;
    }

    .menu {
        margin-left: -42px;
        margin-right: -42px;
        padding: 31px 42px 80px;
    }

    .menu-item {
        min-height: 108px;
        padding: 0 60px;
        gap: 23px;
        font-size: clamp(18px, 3.4vw, 27px);
    }

    .chat-button {
        width: 119px;
        height: 119px;
        right: 27px;
        bottom: 255px;
    }
}

/* SMALL PHONES */

@media (max-width: 430px) {

    .topbar {
        height: 220px;
        padding: 0 6% 30px;
    }

    .navigation {
        gap: 16px;
    }

    .home-button {
        width: 60px;
        height: 53px;
        font-size: 30px;
    }

    .arrow-button {
        margin-left: 0;
    }

    .container {
        width: calc(100% - 32px);
        margin-top: 26px;
    }

    .balance-card {
        padding: 17px 15px 22px;
    }

    .balance-heading {
        margin-bottom: 27px;
    }

    .balance-heading h1 {
        font-size: 24px;
        margin-top: 10px;
    }

    .wallet-label {
        min-width: 75px;
        padding: 10px 8px;
        font-size: 12px;
    }

    .wallet-row {
        gap: 7px;
        margin-bottom: 23px;
    }

    .wallet-row:last-child {
        margin-bottom: 7px;
    }

    .wallet-icon {
        width: 27px;
        font-size: 23px;
    }

    .wallet-name,
    .wallet-amount {
        font-size: clamp(16px, 4.1vw, 20px);
    }

    .actions {
        gap: 12px;
        margin-top: 15px;
        margin-bottom: 26px;
    }

    .action-button {
        height: 66px;
        font-size: clamp(15px, 4vw, 19px);
        gap: 6px;
    }

    .action-icon {
        font-size: 22px;
    }

    .menu {
        margin-left: -16px;
        margin-right: -16px;
        padding: 20px 16px 80px;
    }

    .menu-item {
        min-height: 80px;
        padding: 0 9px;
        gap: 15px;
        font-size: clamp(15px, 3.8vw, 19px);
    }

    .menu-icon {
        width: 27px;
        font-size: 25px;
    }

    .submenu .menu-item {
        min-height: 62px;
        padding-left: 42px;
        font-size: 16px;
    }

    .chat-button {
        width: 82px;
        height: 82px;
        right: 18px;
        bottom: 120px;
    }

    .chat-bubble {
        width: 39px;
        height: 28px;
    }

    .online-dot {
        width: 25px;
        height: 25px;
        left: 0;
        bottom: 0;
    }
}
</style>
</head>

<body>

<!-- TOP NAVIGATION -->

<header class="topbar">

    <button class="back-button"
            onclick="history.back()"
            aria-label="Go back">
        &#8592;
    </button>

    <nav class="navigation">

        <button class="home-button"
                onclick="showMessage('Dashboard selected')"
                aria-label="Home">
            &#8962;
        </button>

        <button class="arrow-button"
                onclick="showMessage('Navigation menu selected')"
                aria-label="Open menu">
            &#8964;
        </button>

        <button class="profile-button"
                onclick="showMessage('Profile selected')"
                aria-label="Profile">
            &#9817;
        </button>

    </nav>

</header>


<main class="container">

    <!-- BALANCE CARD -->

    <section class="balance-card">

        <div class="balance-heading">

            <h1>Account Balance</h1>

            <span class="wallet-label">
                WALLET
            </span>

        </div>

        <div class="wallet-row">

            <span class="wallet-icon">&#128179;</span>

            <span class="wallet-name">
                Main Wallet
            </span>

            <span class="wallet-amount">
                $913.45
            </span>

        </div>

        <div class="wallet-row">

            <span class="wallet-icon">&#127963;</span>

            <span class="wallet-name">
                Profit Wallet
            </span>

            <span class="wallet-amount">
                $261.20
            </span>

        </div>

    </section>


    <!-- DEPOSIT AND INVEST BUTTONS -->

    <section class="actions">

        <button class="action-button deposit-button"
                onclick="showMessage('Deposit selected')">

            <span class="action-icon">&#8853;</span>

            Deposit

        </button>

        <button class="action-button invest-button"
                onclick="showMessage('Invest Now selected')">

            <span class="action-icon">&#8680;</span>

            Invest Now

        </button>

    </section>


    <!-- DASHBOARD MENU -->

    <section class="menu">

        <button class="menu-item"
                onclick="showMessage('Dashboard selected')">

            <span class="menu-icon">&#8862;</span>

            <span>DASHBOARD</span>

        </button>


        <button class="menu-item"
                onclick="showMessage('All Schema selected')">

            <span class="menu-icon">&#9745;</span>

            <span>ALL SCHEMA</span>

        </button>


        <button class="menu-item"
                onclick="showMessage('Schema Logs selected')">

            <span class="menu-icon">&#9707;</span>

            <span>SCHEMA LOGS</span>

        </button>


        <button class="menu-item"
                onclick="showMessage('All Transactions selected')">

            <span class="menu-icon">&#9633;</span>

            <span>ALL TRANSACTIONS</span>

        </button>


        <button class="menu-item"
                onclick="showMessage('Add Money selected')">

            <span class="menu-icon">&#8853;</span>

            <span>ADD MONEY</span>

        </button>


        <button class="menu-item"
                onclick="showMessage('Add Money Log selected')">

            <span class="menu-icon">&#8862;</span>

            <span>ADD MONEY LOG</span>

        </button>


        <button class="menu-item"
                onclick="showMessage('Wallet Exchange selected')">

            <span class="menu-icon">&#8644;</span>

            <span>WALLET EXCHANGE</span>

        </button>


        <button class="menu-item"
                onclick="showMessage('Send Money selected')">

            <span class="menu-icon">&#8680;</span>

            <span>SEND MONEY</span>

        </button>


        <button class="menu-item"
                onclick="showMessage('Send Money Log selected')">

            <span class="menu-icon">&#9729;</span>

            <span>SEND MONEY LOG</span>

        </button>


        <!-- WITHDRAW -->

        <button class="menu-item"
                id="withdrawButton"
                aria-expanded="true"
                onclick="toggleWithdraw()">

            <span class="menu-icon">&#127963;</span>

            <span>WITHDRAW</span>

            <span class="menu-arrow"
                  id="withdrawArrow">&#9652;</span>

        </button>


        <div class="submenu" id="withdrawSubmenu">

            <button class="menu-item"
                    onclick="showMessage('Withdraw Funds selected')">

                <span class="menu-icon">&#8680;</span>

                <span>WITHDRAW FUNDS</span>

            </button>

            <button class="menu-item"
                    onclick="showMessage('Withdrawal Log selected')">

                <span class="menu-icon">&#9707;</span>

                <span>WITHDRAWAL LOG</span>

            </button>

        </div>

    </section>

</main>


<!-- FLOATING CHAT BUTTON -->

<button class="chat-button"
        onclick="showMessage('Chat support selected')"
        aria-label="Chat support">

    <span class="chat-bubble"></span>

    <span class="online-dot"></span>

</button>


<!-- NOTIFICATION -->

<div class="notification"
     id="notification"
     role="status">
</div>


<script>

let notificationTimer;

function showMessage(message) {

    const notification =
        document.getElementById("notification");

    notification.textContent = message;

    notification.classList.add("show");

    clearTimeout(notificationTimer);

    notificationTimer = setTimeout(function() {

        notification.classList.remove("show");

    }, 2500);

}


function toggleWithdraw() {

    const submenu =
        document.getElementById("withdrawSubmenu");

    const arrow =
        document.getElementById("withdrawArrow");

    const button =
        document.getElementById("withdrawButton");

    const isOpen =
        !submenu.classList.contains("hidden");

    submenu.classList.toggle("hidden", isOpen);

    button.setAttribute(
        "aria-expanded",
        String(!isOpen)
    );

    arrow.innerHTML = isOpen
        ? "&#9662;"
        : "&#9652;";

}

</script>

</body>
</html>
